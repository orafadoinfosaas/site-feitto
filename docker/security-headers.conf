# Cabeçalhos de segurança.
#
# Precisam viver num arquivo à parte por causa de uma regra do nginx que pega
# muita gente: `add_header` só é herdado pelo bloco filho se esse bloco NÃO
# declarar nenhum `add_header` próprio. Como as rotas de cache declaram
# Cache-Control, elas apagariam toda a segurança herdada do server — foi o que
# aconteceu com a home até este include existir.
#
# Regra: todo location que usa add_header inclui este arquivo antes.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# O site não carrega nada de terceiro enquanto não houver consentimento.
# Os domínios do GA4 e do Pixel entram aqui porque a política precisa
# permiti-los de antemão: eles só sobem depois do aceite, mas se a CSP os
# bloqueasse, consentir não teria efeito prático.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://connect.facebook.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
