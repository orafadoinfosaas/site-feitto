# Serve o site estático do Astro.
# Atrás do proxy do EasyPanel: TLS e redirecionamento ficam com ele.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # ---------------------------------------------------------------------
  # Cabeçalhos de segurança
  # ---------------------------------------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # O site não carrega nada de terceiro enquanto não houver consentimento.
  # connect-src libera o Supabase (o formulário) e os domínios de análise e
  # anúncio, que só entram em cena depois do aceite — a política precisa
  # permiti-los de antemão, senão o consentimento não teria efeito prático.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://*.analytics.google.com https://connect.facebook.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # ---------------------------------------------------------------------
  # Compressão
  # ---------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml;
  # woff2 e webp já vêm comprimidos: recomprimir só gasta CPU

  # ---------------------------------------------------------------------
  # Cache
  # ---------------------------------------------------------------------

  # nomes com hash: nunca mudam de conteúdo
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # o HTML precisa ser revalidado, senão uma correção demora a aparecer
  location = / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files /index.html =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # ---------------------------------------------------------------------
  # Rotas
  #
  # O Astro gera /metodo/index.html. Sem o try_files com barra, /metodo
  # daria 404.
  # ---------------------------------------------------------------------
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # arquivos ocultos não são servidos
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
