# Serve o site estático do Astro.
# Atrás do proxy do EasyPanel: TLS e redirecionamento ficam com ele.

server {
  # 8080 é o padrão do nginx-unprivileged; 3000 é o que a maioria dos painéis
  # encaminha sem você configurar nada. Escutar nas duas evita o "service is
  # not reachable" por desencontro de porta, e nenhuma delas exige privilégio.
  listen 8080;
  listen [::]:8080;
  listen 3000;
  listen [::]:3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # ---------------------------------------------------------------------
  # Compressão
  # ---------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml;
  # woff2 e webp já vêm comprimidos: recomprimir só gasta CPU

  # ---------------------------------------------------------------------
  # Cache
  #
  # Todo bloco abaixo reinclui os cabeçalhos de segurança: quem declara
  # add_header para de herdar os de cima.
  # ---------------------------------------------------------------------

  # nomes com hash: o conteúdo nunca muda
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # o HTML precisa ser revalidado, senão uma correção demora a aparecer
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files /index.html =404;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # ---------------------------------------------------------------------
  # Rotas
  #
  # O Astro gera /metodo/index.html. Sem o try_files com barra, /metodo
  # daria 404.
  # ---------------------------------------------------------------------
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # arquivos ocultos não são servidos
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
