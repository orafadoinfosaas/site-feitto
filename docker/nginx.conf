# Serve o site estático do Astro.
# Atrás do proxy do EasyPanel: TLS e redirecionamento ficam com ele.

# Só o domínio final é indexável. Qualquer outro host — pré-visualização,
# endereço temporário da hospedagem — recebe noindex automaticamente. Resolver
# isto aqui, e não num build argument, evita que o site de teste apareça na
# busca por alguém ter esquecido de marcar uma caixa.
map $host $robots_tag {
  default            "noindex, nofollow";
  "feitto.com.br"     "";
  "www.feitto.com.br" "";
}

server {
  # 80 é para onde o proxy do painel encaminha por padrão. 8080 e 3000 ficam
  # como alternativa, para o contêiner atender qualquer configuração sem
  # precisar de rebuild.
  listen 80;
  listen [::]:80;
  listen 8080;
  listen [::]:8080;
  listen 3000;
  listen [::]:3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;
  add_header X-Robots-Tag $robots_tag always;

  # ---------------------------------------------------------------------
  # Compressão
  # ---------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml;
  # woff2 e webp já vêm comprimidos: recomprimir só gasta CPU

  # ---------------------------------------------------------------------
  # Cache
  #
  # Todo bloco abaixo reinclui os cabeçalhos de segurança: quem declara
  # add_header para de herdar os de cima.
  # ---------------------------------------------------------------------

  # nomes com hash: o conteúdo nunca muda
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # o HTML precisa ser revalidado, senão uma correção demora a aparecer
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files /index.html =404;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # ---------------------------------------------------------------------
  # Rotas
  #
  # O Astro gera /metodo/index.html. Sem o try_files com barra, /metodo
  # daria 404.
  # ---------------------------------------------------------------------
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # arquivos ocultos não são servidos
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
